<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мост · камера телефона на ноут</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --ink:#12181a;
    --paper:#eef2ef;
    --line:#0f1a17;
    --signal:#ff5a36;
    --signal-dim:#ffc9b8;
    --ok:#2f9e6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Courier New', ui-monospace, monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 5vw 5vh;
  }
  .wire{
    width:100%;
    max-width:520px;
  }
  .wire-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid rgba(238,242,239,.25);
    padding-bottom:14px;
    margin-bottom:36px;
  }
  .wire-top h1{
    font-size:15px;
    font-weight:400;
    letter-spacing:.02em;
    margin:0;
  }
  .wire-top span{
    font-size:12px;
    color:var(--signal-dim);
  }
  /* --- role picker --- */
  .picker{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .role-btn{
    all:unset;
    cursor:pointer;
    border:1px solid rgba(238,242,239,.4);
    padding:26px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .role-btn:hover{border-color:var(--signal); background:rgba(255,90,54,.06);}
  .role-btn .name{font-size:22px;}
  .role-btn .hint{font-size:12px; color:rgba(238,242,239,.55); text-align:right; max-width:170px; line-height:1.5;}
  .role-btn .arrow{font-size:20px; margin-left:14px; color:var(--signal);}

  /* --- shared screen chrome --- */
  .screen{display:none;}
  .screen.active{display:block;}
  .back{
    all:unset; cursor:pointer;
    font-size:12px; color:rgba(238,242,239,.5);
    margin-bottom:22px; display:inline-block;
  }
  .back:hover{color:var(--paper);}
  .status-line{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:rgba(238,242,239,.7);
    margin-bottom:22px;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:rgba(238,242,239,.3); flex-shrink:0;}
  .dot.live{background:var(--ok); box-shadow:0 0 0 3px rgba(47,158,107,.25);}
  .dot.wait{background:var(--signal); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* phone screen */
  .code-block{
    text-align:center;
    padding:34px 0 30px;
    border:1px solid rgba(238,242,239,.4);
    margin-bottom:24px;
  }
  .code-block .label{font-size:11px; letter-spacing:.15em; color:rgba(238,242,239,.5); margin-bottom:16px;}
  .code-block .code{font-size:44px; letter-spacing:.12em; color:var(--signal);}
  video{
    width:100%;
    background:#000;
    display:block;
    aspect-ratio:3/4;
    object-fit:cover;
  }
  .laptop video{aspect-ratio:16/9;}
  .field{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  input[type=text]{
    flex:1;
    background:transparent;
    border:1px solid rgba(238,242,239,.4);
    color:var(--paper);
    font-family:inherit;
    font-size:20px;
    letter-spacing:.1em;
    padding:14px 16px;
    text-transform:uppercase;
  }
  input[type=text]:focus{outline:none; border-color:var(--signal);}
  input[type=text]::placeholder{color:rgba(238,242,239,.3); letter-spacing:normal;}
  button.go{
    all:unset; cursor:pointer;
    background:var(--signal);
    color:var(--ink);
    padding:0 22px;
    font-family:inherit;
    font-size:14px;
    display:flex; align-items:center;
  }
  button.go:hover{background:#ff7955;}
  button.go:disabled{background:rgba(238,242,239,.15); color:rgba(238,242,239,.4); cursor:default;}
  .note{
    font-size:12px;
    line-height:1.6;
    color:rgba(238,242,239,.45);
    margin-top:6px;
  }
</style>
</head>
<body>
<div class="wire">
  <div class="wire-top">
    <h1>мост</h1>
    <span id="topHint">телефон → ноут, напрямую</span>
  </div>

  <!-- ROLE PICKER -->
  <div class="picker screen active" id="screenPicker">
    <button class="role-btn" onclick="startPhone()">
      <span class="name">📱 Телефон</span>
      <span class="hint">отдаёт камеру и звук<span class="arrow">→</span></span>
    </button>
    <button class="role-btn" onclick="startLaptop()">
      <span class="name">💻 Ноут</span>
      <span class="hint">вводит код, принимает<span class="arrow">→</span></span>
    </button>
  </div>

  <!-- PHONE SCREEN -->
  <div class="screen" id="screenPhone">
    <button class="back" onclick="location.reload()">← назад</button>
    <div class="status-line">
      <span class="dot wait" id="phoneDot"></span>
      <span id="phoneStatus">включаю камеру…</span>
    </div>
    <div class="code-block">
      <div class="label">КОД ДЛЯ НОУТА</div>
      <div class="code" id="phoneCode">····</div>
    </div>
    <video id="phoneVideo" autoplay playsinline muted></video>
    <p class="note">Держи эту страницу открытой. Как только на ноуте введут код — трансляция пойдёт сама.</p>
  </div>

  <!-- LAPTOP SCREEN -->
  <div class="screen laptop" id="screenLaptop">
    <button class="back" onclick="location.reload()">← назад</button>
    <div class="status-line">
      <span class="dot" id="laptopDot"></span>
      <span id="laptopStatus">введи код с телефона</span>
    </div>
    <div class="field">
      <input type="text" id="codeInput" placeholder="код с телефона" maxlength="12" autocomplete="off">
      <button class="go" id="connectBtn" onclick="connectToPhone()">Подключить</button>
    </div>
    <video id="laptopVideo" autoplay playsinline></video>
    <p class="note">Соединение прямое (WebRTC), видео не проходит через сервер — только сигнал для установки связи.</p>
  </div>
</div>

<script>
const PREFIX = "most-";
function randomCode(len=4){
  const chars = "23456789ACDEFGHJKLMNPQRSTUVWXYZ";
  let s = "";
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- PHONE ROLE ---------------- */
async function startPhone(){
  show('screenPhone');
  const code = randomCode();
  document.getElementById('phoneCode').textContent = code;

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment' },
      audio:true
    });
  }catch(e){
    document.getElementById('phoneStatus').textContent = 'нет доступа к камере/микрофону: ' + e.message;
    return;
  }
  document.getElementById('phoneVideo').srcObject = stream;
  document.getElementById('phoneStatus').textContent = 'жду подключения ноута…';

  const peer = new Peer(PREFIX + code);
  peer.on('open', ()=>{
    document.getElementById('phoneStatus').textContent = 'жду подключения ноута…';
  });
  peer.on('call', call=>{
    call.answer(stream);
    document.getElementById('phoneDot').classList.remove('wait');
    document.getElementById('phoneDot').classList.add('live');
    document.getElementById('phoneStatus').textContent = 'в эфире — ноут смотрит и слушает';
    call.on('close', ()=>{
      document.getElementById('phoneDot').classList.remove('live');
      document.getElementById('phoneDot').classList.add('wait');
      document.getElementById('phoneStatus').textContent = 'ноут отключился, жду снова…';
    });
  });
  peer.on('error', err=>{
    document.getElementById('phoneStatus').textContent = 'ошибка связи: ' + err.type;
  });
}

/* ---------------- LAPTOP ROLE ---------------- */
function startLaptop(){
  show('screenLaptop');
  document.getElementById('codeInput').focus();
  document.getElementById('codeInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') connectToPhone();
  });
}

function connectToPhone(){
  const raw = document.getElementById('codeInput').value.trim().toUpperCase();
  if(!raw) return;
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  document.getElementById('laptopStatus').textContent = 'соединяюсь…';
  document.getElementById('laptopDot').classList.add('wait');

  const peer = new Peer();
  peer.on('open', ()=>{
    const call = peer.call(PREFIX + raw, new MediaStream());
    call.on('stream', remoteStream=>{
      document.getElementById('laptopVideo').srcObject = remoteStream;
      document.getElementById('laptopDot').classList.remove('wait');
      document.getElementById('laptopDot').classList.add('live');
      document.getElementById('laptopStatus').textContent = 'подключено — видно и слышно телефон';
    });
    call.on('close', ()=>{
      document.getElementById('laptopDot').classList.remove('live');
      document.getElementById('laptopStatus').textContent = 'телефон отключился';
      btn.disabled = false;
    });
    call.on('error', ()=>{
      document.getElementById('laptopStatus').textContent = 'не удалось подключиться, проверь код';
      document.getElementById('laptopDot').classList.remove('wait');
      btn.disabled = false;
    });
  });
  peer.on('error', err=>{
    document.getElementById('laptopStatus').textContent = 'ошибка: ' + err.type + ' (проверь код)';
    document.getElementById('laptopDot').classList.remove('wait');
    btn.disabled = false;
  });
}
</script>
</body>
</html>
