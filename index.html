<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Phone Camera</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #080808;
    color: white;

    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;

    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.card {
    background: #151515;

    border: 1px solid #292929;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 20px;
}

.roles {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.role {
    border: 2px solid #333;

    background: #202020;

    color: white;

    border-radius: 15px;

    padding: 35px 10px;

    font-size: 20px;

    cursor: pointer;
}

.role:hover {
    border-color: #1683ff;
}

button {
    width: 100%;

    border: 0;

    border-radius: 10px;

    padding: 15px;

    margin-top: 15px;

    background: #1683ff;

    color: white;

    font-size: 17px;

    cursor: pointer;
}

button:hover {
    background: #086bd1;
}

input {
    width: 100%;

    padding: 16px;

    background: #090909;

    color: white;

    border: 1px solid #333;

    border-radius: 10px;

    text-align: center;

    font-size: 28px;

    letter-spacing: 8px;
}

.code {
    text-align: center;

    font-size: 52px;

    font-weight: bold;

    letter-spacing: 12px;

    margin: 25px 0;
}

.status {
    text-align: center;

    padding: 15px;

    color: #aaa;
}

.green {
    color: #45e879;
}

.red {
    background: #d83b3b;
}

video {
    width: 100%;

    background: black;

    border-radius: 15px;

    display: block;

    margin-top: 15px;
}

.hidden {
    display: none;
}

.audioButton {
    background: #292929;
}

@media(max-width:600px) {

    .roles {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    .code {
        font-size: 40px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>📡 Phone Camera</h1>

<div class="subtitle">
Камера телефона → ноутбук
</div>


<!-- ВЫБОР -->

<div id="selectPanel" class="card">

<h2>Выбери устройство</h2>

<div class="roles">

<button
    class="role"
    onclick="startPhone()"
>
📱 Я ТЕЛЕФОН
</button>

<button
    class="role"
    onclick="startPC()"
>
💻 Я НОУТБУК
</button>

</div>

</div>


<!-- ТЕЛЕФОН -->

<div
    id="phonePanel"
    class="card hidden"
>

<h2>📱 Телефон</h2>

<p>
Введи этот код на ноутбуке:
</p>

<div
    id="roomCode"
    class="code"
>
------
</div>

<div
    id="phoneStatus"
    class="status"
>
Создание кода...
</div>

<video
    id="localVideo"
    autoplay
    playsinline
    muted
></video>

<button onclick="startCamera()">
📷 Включить камеру
</button>

<button
    class="red"
    onclick="stopEverything()"
>
⛔ Остановить
</button>

</div>


<!-- НОУТБУК -->

<div
    id="pcPanel"
    class="card hidden"
>

<h2>💻 Ноутбук</h2>

<p>
Введи код телефона:
</p>

<input
    id="codeInput"
    maxlength="6"
    inputmode="numeric"
    placeholder="000000"
>

<button onclick="connectPC()">
🔗 Подключиться
</button>

<div
    id="pcStatus"
    class="status"
>
🔴 Не подключено
</div>

<video
    id="remoteVideo"
    autoplay
    playsinline
></video>

<button
    class="audioButton"
    onclick="enableAudio()"
>
🔊 Включить звук
</button>

<button
    class="red"
    onclick="stopEverything()"
>
⛔ Отключиться
</button>

</div>

</div>


<script>

/* =========================================
   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
========================================= */

let peer = null;

let signalConnection = null;

let localStream = null;

let rtc = null;

let role = null;

let roomCode = null;

let pendingCandidates = [];

let remoteDescriptionSet = false;

let rtcStarted = false;


/* =========================================
   WEBRTC CONFIG
========================================= */

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        },

        {
            urls: "stun:stun2.l.google.com:19302"
        }

    ]

};


/* =========================================
   КОД
========================================= */

function generateCode() {

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}


/* =========================================
   ТЕЛЕФОН
========================================= */

function startPhone() {

    role = "phone";

    document
        .getElementById("selectPanel")
        .classList.add("hidden");

    document
        .getElementById("phonePanel")
        .classList.remove("hidden");

    createPhonePeer();

}


/* =========================================
   PEER ТЕЛЕФОНА
========================================= */

function createPhonePeer() {

    roomCode = generateCode();

    document
        .getElementById("roomCode")
        .innerText = roomCode;


    peer = new Peer(
        roomCode,
        {
            debug: 1
        }
    );


    peer.on(
        "open",
        function(id) {

            console.log(
                "PHONE PEER:",
                id
            );

            document
                .getElementById("phoneStatus")
                .innerHTML =
                "🟢 Код готов. Жду ноутбук...";

            document
                .getElementById("phoneStatus")
                .className =
                "status green";

        }
    );


    /*
       Ноутбук подключился
    */

    peer.on(
        "connection",
        function(connection) {

            console.log(
                "💻 Ноутбук подключается..."
            );

            signalConnection = connection;


            signalConnection.on(
                "open",
                async function() {

                    console.log(
                        "💻 SIGNAL CONNECTION OPEN"
                    );

                    document
                        .getElementById(
                            "phoneStatus"
                        )
                        .innerHTML =
                        "🟢 Ноутбук подключён";


                    /*
                       Если камера уже включена —
                       сразу запускаем WebRTC
                    */

                    if (localStream) {

                        await createPhoneRTC();

                    }

                }
            );


            signalConnection.on(
                "data",
                async function(data) {

                    console.log(
                        "📡 PHONE SIGNAL:",
                        data
                    );


                    /* ANSWER */

                    if (
                        data.type === "answer"
                    ) {

                        if (!rtc) {
                            console.log(
                                "RTC ещё не создан"
                            );
                            return;
                        }


                        try {

                            await rtc
                                .setRemoteDescription({

                                    type: "answer",

                                    sdp: data.sdp

                                });


                            remoteDescriptionSet =
                                true;


                            console.log(
                                "✅ ANSWER УСТАНОВЛЕН"
                            );


                            /*
                               Добавляем накопленные ICE
                            */

                            await flushCandidates();


                        } catch(error) {

                            console.error(
                                "ANSWER ERROR:",
                                error
                            );

                        }

                    }


                    /* ICE */

                    if (
                        data.type === "candidate"
                    ) {

                        if (
                            rtc &&
                            remoteDescriptionSet
                        ) {

                            try {

                                await rtc
                                    .addIceCandidate(
                                        data.candidate
                                    );

                            } catch(error) {

                                console.error(
                                    "ICE ERROR:",
                                    error
                                );

                            }

                        } else {

                            /*
                               ICE пришёл раньше answer
                            */

                            pendingCandidates.push(
                                data.candidate
                            );

                            console.log(
                                "ICE добавлен в очередь"
                            );

                        }

                    }

                }
            );


            signalConnection.on(
                "close",
                function() {

                    document
                        .getElementById(
                            "phoneStatus"
                        )
                        .innerText =
                        "🔴 Ноутбук отключился";

                }
            );

        }
    );


    peer.on(
        "error",
        function(error) {

            console.error(
                "PHONE PEER ERROR:",
                error
            );


            if (
                error.type ===
                "unavailable-id"
            ) {

                peer.destroy();

                setTimeout(
                    createPhonePeer,
                    500
                );

            }

        }
    );

}


/* =========================================
   КАМЕРА ТЕЛЕФОНА
========================================= */

async function startCamera() {

    try {

        /*
           ВАЖНО:
           Теперь включаем и видео,
           и микрофон.
        */

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: {

                        echoCancellation: true,

                        noiseSuppression: true,

                        autoGainControl: true

                    }

                });


        document
            .getElementById("localVideo")
            .srcObject =
            localStream;


        document
            .getElementById("phoneStatus")
            .innerHTML =
            "🟢 Камера и микрофон включены";

        document
            .getElementById("phoneStatus")
            .className =
            "status green";


        /*
           Если ноутбук уже подключён
        */

        if (
            signalConnection &&
            signalConnection.open
        ) {

            await createPhoneRTC();

        }

    } catch(error) {

        console.error(
            error
        );

        alert(
            "Не удалось включить камеру/микрофон:\n\n" +
            error.message
        );

    }

}


/* =========================================
   WEBRTC ТЕЛЕФОНА
========================================= */

async function createPhoneRTC() {

    /*
       Не создаём второе соединение
    */

    if (rtcStarted) {

        console.log(
            "RTC уже запущен"
        );

        return;

    }

    if (!localStream) {

        console.log(
            "Нет камеры"
        );

        return;

    }

    if (
        !signalConnection ||
        !signalConnection.open
    ) {

        console.log(
            "Нет SIGNAL соединения"
        );

        return;

    }


    rtcStarted = true;

    pendingCandidates = [];

    remoteDescriptionSet = false;


    rtc =
        new RTCPeerConnection(
            rtcConfig
        );


    /*
       Камера + микрофон
    */

    localStream
        .getTracks()
        .forEach(
            function(track) {

                rtc.addTrack(
                    track,
                    localStream
                );

            }
        );


    /*
       ICE
    */

    rtc.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                signalConnection &&
                signalConnection.open
            ) {

                signalConnection.send({

                    type: "candidate",

                    candidate:
                        event.candidate

                });

            }

        };


    /*
       Состояние соединения
    */

    rtc.onconnectionstatechange =
        function() {

            console.log(
                "PHONE RTC:",
                rtc.connectionState
            );


            if (
                rtc.connectionState ===
                "connected"
            ) {

                document
                    .getElementById(
                        "phoneStatus"
                    )
                    .innerHTML =
                    "🟢 КАМЕРА ПЕРЕДАЁТСЯ НА НОУТБУК";

            }


            if (
                rtc.connectionState ===
                "failed"
            ) {

                document
                    .getElementById(
                        "phoneStatus"
                    )
                    .innerText =
                    "❌ WebRTC соединение не удалось";

            }

        };


    /*
       Создаём OFFER
    */

    try {

        const offer =
            await rtc.createOffer({

                offerToReceiveAudio: false,

                offerToReceiveVideo: false

            });


        await rtc
            .setLocalDescription(
                offer
            );


        signalConnection.send({

            type: "offer",

            sdp:
                rtc.localDescription.sdp

        });


        console.log(
            "📤 OFFER отправлен"
        );

    } catch(error) {

        console.error(
            "OFFER ERROR:",
            error
        );

    }

}


/* =========================================
   ICE QUEUE
========================================= */

async function flushCandidates() {

    if (!rtc) {
        return;
    }


    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await rtc
                .addIceCandidate(
                    candidate
                );

        } catch(error) {

            console.error(
                "QUEUED ICE ERROR:",
                error
            );

        }

    }


    pendingCandidates = [];

}


/* =========================================
   НОУТБУК
========================================= */

function startPC() {

    role = "pc";


    document
        .getElementById("selectPanel")
        .classList.add("hidden");


    document
        .getElementById("pcPanel")
        .classList.remove("hidden");


    peer =
        new Peer({
            debug: 1
        });


    peer.on(
        "open",
        function() {

            document
                .getElementById("pcStatus")
                .innerText =
                "🟢 Готов. Введи код телефона.";

        }
    );


    peer.on(
        "error",
        function(error) {

            console.error(
                "PC PEER ERROR:",
                error
            );


            document
                .getElementById("pcStatus")
                .innerText =
                "❌ " +
                error.type;

        }
    );

}


/* =========================================
   ПОДКЛЮЧЕНИЕ НОУТБУКА
========================================= */

function connectPC() {

    const code =
        document
            .getElementById("codeInput")
            .value
            .trim();


    if (!/^\d{6}$/.test(code)) {

        alert(
            "Введи 6 цифр."
        );

        return;

    }


    document
        .getElementById("pcStatus")
        .innerText =
        "🟡 Подключение к телефону...";


    signalConnection =
        peer.connect(
            code,
            {
                reliable: true
            }
        );


    signalConnection.on(
        "open",
        function() {

            console.log(
                "📡 SIGNAL CONNECTED"
            );


            document
                .getElementById("pcStatus")
                .innerText =
                "🟢 Телефон найден. Ждём камеру...";

        }
    );


    signalConnection.on(
        "data",
        async function(data) {

            console.log(
                "📡 PC SIGNAL:",
                data
            );


            /* =========================
               OFFER
            ========================= */

            if (
                data.type === "offer"
            ) {

                console.log(
                    "📥 OFFER получен"
                );


                await createPCRTC();


                try {

                    await rtc
                        .setRemoteDescription({

                            type: "offer",

                            sdp: data.sdp

                        });


                    remoteDescriptionSet =
                        true;


                    /*
                       Добавляем ICE,
                       которые могли прийти раньше
                    */

                    await flushCandidates();


                    const answer =
                        await rtc
                            .createAnswer();


                    await rtc
                        .setLocalDescription(
                            answer
                        );


                    signalConnection.send({

                        type: "answer",

                        sdp:
                            rtc.localDescription.sdp

                    });


                    console.log(
                        "📤 ANSWER отправлен"
                    );


                } catch(error) {

                    console.error(
                        "ANSWER ERROR:",
                        error
                    );

                    document
                        .getElementById(
                            "pcStatus"
                        )
                        .innerText =
                        "❌ Ошибка WebRTC: " +
                        error.message;

                }

            }


            /* =========================
               ICE
            ========================= */

            if (
                data.type === "candidate"
            ) {

                if (
                    rtc &&
                    remoteDescriptionSet
                ) {

                    try {

                        await rtc
                            .addIceCandidate(
                                data.candidate
                            );

                    } catch(error) {

                        console.error(
                            "PC ICE ERROR:",
                            error
                        );

                    }

                } else {

                    pendingCandidates.push(
                        data.candidate
                    );

                    console.log(
                        "📦 PC ICE добавлен в очередь"
                    );

                }

            }

        }
    );


    signalConnection.on(
        "close",
        function() {

            document
                .getElementById("pcStatus")
                .innerText =
                "🔴 Телефон отключился";

        }
    );

}


/* =========================================
   WEBRTC НОУТБУКА
========================================= */

async function createPCRTC() {

    /*
       Если уже создан
    */

    if (rtc) {

        return;

    }


    pendingCandidates = [];

    remoteDescriptionSet = false;


    rtc =
        new RTCPeerConnection(
            rtcConfig
        );


    /*
       Получаем ВСЕ треки
       телефона:
       видео + аудио
    */

    rtc.ontrack =
        function(event) {

            console.log(
                "🎥 TRACK ПОЛУЧЕН:",
                event.track.kind
            );


            const video =
                document
                    .getElementById(
                        "remoteVideo"
                    );


            /*
               Используем поток
               из события
            */

            if (
                event.streams &&
                event.streams[0]
            ) {

                video.srcObject =
                    event.streams[0];

            } else {

                /*
                   Запасной вариант
                */

                if (!video.srcObject) {

                    video.srcObject =
                        new MediaStream();

                }

                video.srcObject
                    .addTrack(
                        event.track
                    );

            }


            /*
               ВАЖНО:
               muted НЕ ставим.
            */

            video.muted = false;

            video.volume = 1.0;


            video.play()
                .then(
                    function() {

                        console.log(
                            "▶ VIDEO PLAYING"
                        );

                    }
                )
                .catch(
                    function(error) {

                        console.log(
                            "AUTOPLAY BLOCKED:",
                            error
                        );

                    }
                );


            if (
                event.track.kind ===
                "video"
            ) {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerHTML =
                    "🟢 КАМЕРА ТЕЛЕФОНА РАБОТАЕТ";

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .className =
                    "status green";

            }

        };


    /*
       ICE
    */

    rtc.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                signalConnection &&
                signalConnection.open
            ) {

                signalConnection.send({

                    type: "candidate",

                    candidate:
                        event.candidate

                });

            }

        };


    /*
       Состояние
    */

    rtc.onconnectionstatechange =
        function() {

            console.log(
                "PC RTC:",
                rtc.connectionState
            );


            if (
                rtc.connectionState ===
                "connected"
            ) {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerHTML =
                    "🟢 КАМЕРА + ЗВУК ПОДКЛЮЧЕНЫ";

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .className =
                    "status green";

            }


            if (
                rtc.connectionState ===
                "failed"
            ) {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerText =
                    "❌ WebRTC соединение не удалось";

            }


            if (
                rtc.connectionState ===
                "disconnected"
            ) {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerText =
                    "🟡 Соединение потеряно";

            }

        };


    /*
       Получаем видео
    */

    rtc.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    /*
       Получаем микрофон
    */

    rtc.addTransceiver(
        "audio",
        {
            direction: "recvonly"
        }
    );


    console.log(
        "✅ PC RTC СОЗДАН"
    );

}


/* =========================================
   ВКЛЮЧИТЬ ЗВУК
========================================= */

function enableAudio() {

    const video =
        document
            .getElementById(
                "remoteVideo"
            );


    video.muted = false;

    video.volume = 1.0;


    video.play()
        .then(
            function() {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerHTML =
                    "🔊 Звук включён";

            }
        )
        .catch(
            function(error) {

                console.error(
                    error
                );

                alert(
                    "Браузер не разрешил воспроизведение звука."
                );

            }
        );

}


/* =========================================
   ОСТАНОВКА
========================================= */

function stopEverything() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

    }


    if (rtc) {

        rtc.close();

        rtc = null;

    }


    if (signalConnection) {

        try {

            signalConnection.close();

        } catch(error) {}

    }


    if (peer) {

        try {

            peer.destroy();

        } catch(error) {}

    }


    location.reload();

}

</script>

</body>
</html>
