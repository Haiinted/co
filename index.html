<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер лица</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video {
            transform: scaleX(-1);
            border-radius: 8px;
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }
        #error-message {
            color: #ff4a4a;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Отслеживание лица</h1>
    
    <div id="error-message"></div>

    <div class="video-container">
        <!-- Добавили важные атрибуты для корректного автоплея камеры -->
        <video id="video" width="640" height="480" autoplay playsinline muted></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const errorDiv = document.getElementById('error-message');

        // Запрашиваем камеру с явным указанием размеров кадров
        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 } 
        })
        .then(function(stream) {
            // Привязываем видеопоток к тегу video
            video.srcObject = stream;
            video.onloadedmetadata = function(e) {
                video.play();
                startTracking(); // Запускаем трекер только после того, как видео пошло
            };
        })
        .catch(function(err) {
            errorDiv.innerHTML = "Ошибка: Камера не отвечает или занята другой программой (например, Google Meet). Закрой другие вкладки и обнови страницу.";
            console.error(err);
        });

        function startTracking() {
            const objectsTracker = new tracking.ObjectTracker('face');
            objectsTracker.setInitialScale(4);
            objectsTracker.setStepSize(2);
            objectsTracker.edgesDensity = 0.1;

            tracking.track('#video', objectsTracker);

            objectsTracker.on('track', function(event) {
                context.clearRect(0, 0, canvas.width, canvas.height);

                event.data.forEach(function(rect) {
                    // Зеленая рамка вокруг лица
                    context.strokeStyle = '#00ffcc';
                    context.lineWidth = 4;
                    context.strokeRect(rect.x, rect.y, rect.width, rect.height);

                    // Розовый прицел в центре лица
                    const centerX = rect.x + (rect.width / 2);
                    const centerY = rect.y + (rect.height / 2);
                    
                    context.beginPath();
                    context.arc(centerX, centerY, 8, 0, 2 * Math.PI);
                    context.fillStyle = '#ff0055';
                    context.fill();
                });
            });
        }
    </script>
</body>
</html>
