<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone Camera</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
}

.roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.role {
    border: 2px solid #333;
    background: #202020;
    color: white;
    border-radius: 15px;
    padding: 35px 10px;
    font-size: 20px;
    cursor: pointer;
}

.role:hover {
    border-color: #1683ff;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    background: #1683ff;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #086bd1;
}

input {
    width: 100%;
    padding: 16px;
    background: #090909;
    color: white;
    border: 1px solid #333;
    border-radius: 10px;
    text-align: center;
    font-size: 28px;
    letter-spacing: 8px;
}

.code {
    text-align: center;
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 12px;
    margin: 25px 0;
}

.status {
    text-align: center;
    padding: 15px;
    color: #aaa;
}

.green {
    color: #45e879;
}

.red {
    background: #d83b3b;
}

.red:hover {
    background: #b52c2c;
}

.gray {
    background: #292929;
}

video {
    width: 100%;
    min-height: 200px;
    background: #000;
    border-radius: 15px;
    display: block;
    margin-top: 15px;
    object-fit: contain;
}

.hidden {
    display: none;
}

@media(max-width:600px) {

    .roles {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    .code {
        font-size: 40px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>📡 Phone Camera</h1>

<div class="subtitle">
Камера телефона → ноутбук
</div>


<!-- ============================= -->
<!-- ВЫБОР -->
<!-- ============================= -->

<div id="selectPanel" class="card">

<h2>Выбери устройство</h2>

<div class="roles">

<button
    class="role"
    onclick="startPhone()"
>
📱 Я ТЕЛЕФОН
</button>

<button
    class="role"
    onclick="startPC()"
>
💻 Я НОУТБУК
</button>

</div>

</div>


<!-- ============================= -->
<!-- ТЕЛЕФОН -->
<!-- ============================= -->

<div
    id="phonePanel"
    class="card hidden"
>

<h2>📱 Телефон</h2>

<p>
Введи этот код на ноутбуке:
</p>

<div
    id="roomCode"
    class="code"
>
------
</div>

<div
    id="phoneStatus"
    class="status"
>
Создание кода...
</div>

<video
    id="localVideo"
    autoplay
    playsinline
    muted
></video>

<button onclick="startCamera()">
📷 Включить камеру
</button>

<button
    class="red"
    onclick="stopEverything()"
>
⛔ Остановить
</button>

</div>


<!-- ============================= -->
<!-- НОУТБУК -->
<!-- ============================= -->

<div
    id="pcPanel"
    class="card hidden"
>

<h2>💻 Ноутбук</h2>

<p>
Введи код телефона:
</p>

<input
    id="codeInput"
    maxlength="6"
    inputmode="numeric"
    placeholder="000000"
>

<button onclick="connectPC()">
🔗 Подключиться
</button>

<div
    id="pcStatus"
    class="status"
>
🔴 Не подключено
</div>

<video
    id="remoteVideo"
    autoplay
    playsinline
    controls
></video>

<button
    class="gray"
    onclick="enableAudio()"
>
🔊 Включить звук
</button>

<button
    class="red"
    onclick="stopEverything()"
>
⛔ Отключиться
</button>

</div>

</div>


<script>

/* =========================================
   ПЕРЕМЕННЫЕ
========================================= */

let peer = null;

let localStream = null;

let currentCall = null;

let role = null;

let roomCode = null;


/* =========================================
   PEER CONFIG
========================================= */

const peerOptions = {

    debug: 2,

    config: {

        iceServers: [

            {
                urls:
                "stun:stun.l.google.com:19302"
            },

            {
                urls:
                "stun:stun1.l.google.com:19302"
            },

            {
                urls:
                "stun:stun2.l.google.com:19302"
            }

        ]

    }

};


/* =========================================
   ГЕНЕРАЦИЯ КОДА
========================================= */

function generateCode() {

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}


/* =========================================
   ТЕЛЕФОН
========================================= */

function startPhone() {

    role = "phone";

    document
        .getElementById("selectPanel")
        .classList.add("hidden");

    document
        .getElementById("phonePanel")
        .classList.remove("hidden");

    createPhonePeer();

}


/* =========================================
   PEER ТЕЛЕФОНА
========================================= */

function createPhonePeer() {

    roomCode = generateCode();


    document
        .getElementById("roomCode")
        .innerText =
        roomCode;


    peer =
        new Peer(
            roomCode,
            peerOptions
        );


    peer.on(
        "open",
        function(id) {

            console.log(
                "PHONE PEER ID:",
                id
            );


            document
                .getElementById(
                    "phoneStatus"
                )
                .innerHTML =
                "🟢 Код готов. Жду ноутбук...";


            document
                .getElementById(
                    "phoneStatus"
                )
                .className =
                "status green";

        }
    );


    /*
       НОУТБУК ЗВОНИТ ТЕЛЕФОНУ
    */

    peer.on(
        "call",
        function(call) {

            console.log(
                "📞 ВХОДЯЩИЙ WEBRTC CALL"
            );


            currentCall = call;


            document
                .getElementById(
                    "phoneStatus"
                )
                .innerText =
                "🟡 Ноутбук подключается...";


            /*
               Если камера уже включена —
               сразу отвечаем
            */

            if (localStream) {

                answerCall(call);

            } else {

                /*
                   Камера ещё не включена.
                   Просим включить её.
                */

                document
                    .getElementById(
                        "phoneStatus"
                    )
                    .innerText =
                    "🟡 Ноутбук подключён. Включи камеру.";

            }

        }
    );


    peer.on(
        "error",
        function(error) {

            console.error(
                "PHONE PEER ERROR:",
                error
            );


            document
                .getElementById(
                    "phoneStatus"
                )
                .innerText =
                "❌ " + error.type;


            /*
               Если код занят —
               генерируем новый
            */

            if (
                error.type ===
                "unavailable-id"
            ) {

                try {
                    peer.destroy();
                } catch(e) {}


                setTimeout(
                    createPhonePeer,
                    500
                );

            }

        }
    );

}


/* =========================================
   ОТВЕТ НА ЗВОНОК
========================================= */

function answerCall(call) {

    console.log(
        "📤 ОТВЕЧАЕМ НА WEBRTC CALL"
    );


    call.answer(
        localStream
    );


    currentCall = call;


    document
        .getElementById(
            "phoneStatus"
        )
        .innerHTML =
        "🟢 ТРАНСЛЯЦИЯ КАМЕРЫ И ЗВУКА";


    document
        .getElementById(
            "phoneStatus"
        )
        .className =
        "status green";


    call.on(
        "close",
        function() {

            document
                .getElementById(
                    "phoneStatus"
                )
                .innerText =
                "🔴 Ноутбук отключился";

        }
    );


    call.on(
        "error",
        function(error) {

            console.error(
                "CALL ERROR:",
                error
            );

        }
    );

}


/* =========================================
   КАМЕРА
========================================= */

async function startCamera() {

    try {

        console.log(
            "📷 Запрашиваем камеру..."
        );


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: {

                        echoCancellation: true,

                        noiseSuppression: true,

                        autoGainControl: true

                    }

                });


        console.log(
            "✅ КАМЕРА ПОЛУЧЕНА"
        );


        /*
           Показываем камеру
           самому телефону
        */

        const localVideo =
            document.getElementById(
                "localVideo"
            );


        localVideo.srcObject =
            localStream;


        localVideo.muted = true;


        localVideo.play()
            .catch(
                function(error) {

                    console.log(
                        "LOCAL PLAY ERROR:",
                        error
                    );

                }
            );


        document
            .getElementById(
                "phoneStatus"
            )
            .innerHTML =
            "🟢 Камера и микрофон включены";


        document
            .getElementById(
                "phoneStatus"
            )
            .className =
            "status green";


        /*
           Если ноутбук уже позвонил —
           отвечаем
        */

        if (currentCall) {

            answerCall(currentCall);

        }

    } catch(error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        alert(
            "Не удалось включить камеру:\n\n" +
            error.message
        );

    }

}


/* =========================================
   НОУТБУК
========================================= */

function startPC() {

    role = "pc";


    document
        .getElementById(
            "selectPanel"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "pcPanel"
        )
        .classList.remove("hidden");


    peer =
        new Peer(
            peerOptions
        );


    peer.on(
        "open",
        function(id) {

            console.log(
                "PC PEER:",
                id
            );


            document
                .getElementById(
                    "pcStatus"
                )
                .innerHTML =
                "🟢 Готов. Введи код телефона.";

        }
    );


    peer.on(
        "error",
        function(error) {

            console.error(
                "PC PEER ERROR:",
                error
            );


            document
                .getElementById(
                    "pcStatus"
                )
                .innerText =
                "❌ " + error.type;

        }
    );

}


/* =========================================
   ПОДКЛЮЧИТЬСЯ К ТЕЛЕФОНУ
========================================= */

function connectPC() {

    const code =
        document
            .getElementById(
                "codeInput"
            )
            .value
            .trim();


    if (!/^\d{6}$/.test(code)) {

        alert(
            "Введи 6 цифр."
        );

        return;

    }


    if (!peer) {

        alert(
            "Peer ещё не готов."
        );

        return;

    }


    document
        .getElementById(
            "pcStatus"
        )
        .innerText =
        "🟡 Подключаемся к телефону...";


    console.log(
        "📞 Звоним телефону:",
        code
    );


    /*
       Создаём пустой поток.

       Мы ничего не отправляем
       с ноутбука.

       Нам нужно только получить
       камеру телефона.
    */

    const emptyStream =
        new MediaStream();


    const call =
        peer.call(
            code,
            emptyStream
        );


    if (!call) {

        document
            .getElementById(
                "pcStatus"
            )
            .innerText =
            "❌ Не удалось создать звонок";

        return;

    }


    currentCall = call;


    document
        .getElementById(
            "pcStatus"
        )
        .innerText =
        "🟡 Телефон найден. Получаем камеру...";


    /*
       ПОЛУЧАЕМ ПОТОК
    */

    call.on(
        "stream",
        function(remoteStream) {

            console.log(
                "🎥🎤 REMOTE STREAM ПОЛУЧЕН!"
            );


            console.log(
                "Видео:",
                remoteStream.getVideoTracks()
            );


            console.log(
                "Аудио:",
                remoteStream.getAudioTracks()
            );


            const video =
                document
                    .getElementById(
                        "remoteVideo"
                    );


            /*
               Самое главное:
               ставим поток прямо
               в video
            */

            video.srcObject =
                remoteStream;


            video.muted = false;

            video.volume = 1.0;


            /*
               Ждём загрузку видео
            */

            video.onloadedmetadata =
                function() {

                    console.log(
                        "📺 VIDEO METADATA LOADED"
                    );


                    video.play()
                        .then(
                            function() {

                                console.log(
                                    "▶ VIDEO PLAYING"
                                );


                                document
                                    .getElementById(
                                        "pcStatus"
                                    )
                                    .innerHTML =
                                    "🟢 КАМЕРА ТЕЛЕФОНА РАБОТАЕТ";

                                document
                                    .getElementById(
                                        "pcStatus"
                                    )
                                    .className =
                                    "status green";

                            }
                        )
                        .catch(
                            function(error) {

                                console.error(
                                    "PLAY ERROR:",
                                    error
                                );

                                document
                                    .getElementById(
                                        "pcStatus"
                                    )
                                    .innerText =
                                    "🟡 Поток получен. Нажми «Включить звук».";

                            }
                        );

                };


            /*
               На всякий случай запускаем
               play ещё раз
            */

            video.play()
                .catch(
                    function(error) {

                        console.log(
                            "AUTOPLAY:",
                            error
                        );

                    }
                );

        }
    );


    call.on(
        "close",
        function() {

            console.log(
                "CALL CLOSED"
            );


            document
                .getElementById(
                    "pcStatus"
                )
                .innerText =
                "🔴 Телефон отключился";


            const video =
                document
                    .getElementById(
                        "remoteVideo"
                    );


            video.srcObject = null;

        }
    );


    call.on(
        "error",
        function(error) {

            console.error(
                "WEBRTC CALL ERROR:",
                error
            );


            document
                .getElementById(
                    "pcStatus"
                )
                .innerText =
                "❌ Ошибка соединения: " +
                error.message;

        }
    );

}


/* =========================================
   ЗВУК
========================================= */

function enableAudio() {

    const video =
        document
            .getElementById(
                "remoteVideo"
            );


    video.muted = false;

    video.volume = 1.0;


    video.play()
        .then(
            function() {

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .innerHTML =
                    "🔊 ЗВУК ВКЛЮЧЁН";

                document
                    .getElementById(
                        "pcStatus"
                    )
                    .className =
                    "status green";

            }
        )
        .catch(
            function(error) {

                console.error(
                    error
                );

                alert(
                    "Браузер заблокировал звук."
                );

            }
        );

}


/* =========================================
   ОСТАНОВКА
========================================= */

function stopEverything() {

    console.log(
        "⛔ Остановка"
    );


    if (currentCall) {

        try {

            currentCall.close();

        } catch(e) {}

        currentCall = null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        localStream = null;

    }


    if (peer) {

        try {

            peer.destroy();

        } catch(e) {}

        peer = null;

    }


    location.reload();

}

</script>

</body>
</html>
