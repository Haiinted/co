```html
<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Phone Camera</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #080808;
    color: white;

    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;

    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.card {
    background: #151515;

    border: 1px solid #292929;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 20px;
}

.roles {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.role {
    border: 2px solid #333;

    background: #202020;

    color: white;

    border-radius: 15px;

    padding: 35px 10px;

    font-size: 20px;

    cursor: pointer;
}

.role:hover {
    border-color: #1683ff;
}

button {
    width: 100%;

    border: 0;

    border-radius: 10px;

    padding: 15px;

    margin-top: 15px;

    background: #1683ff;

    color: white;

    font-size: 17px;

    cursor: pointer;
}

button:hover {
    background: #086bd1;
}

input {
    width: 100%;

    padding: 16px;

    background: #090909;

    color: white;

    border: 1px solid #333;

    border-radius: 10px;

    text-align: center;

    font-size: 28px;

    letter-spacing: 8px;
}

.code {
    text-align: center;

    font-size: 52px;

    font-weight: bold;

    letter-spacing: 12px;

    margin: 25px 0;
}

.status {
    text-align: center;

    padding: 15px;

    color: #aaa;
}

.green {
    color: #45e879;
}

.red {
    background: #d83b3b;
}

video {
    width: 100%;

    background: black;

    border-radius: 15px;

    display: block;

    margin-top: 15px;
}

.hidden {
    display: none;
}

@media(max-width:600px) {

    .roles {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    .code {
        font-size: 40px;
    }

}

</style>

</head>

<body>


<div class="container">

<h1>📡 Phone Camera</h1>

<div class="subtitle">
Камера телефона → ноутбук
</div>


<!-- ============================= -->
<!-- ВЫБОР -->
<!-- ============================= -->

<div id="selectPanel" class="card">

<h2>Выбери устройство</h2>

<div class="roles">

<button
    class="role"
    onclick="startPhone()"
>
📱 Я ТЕЛЕФОН
</button>

<button
    class="role"
    onclick="startPC()"
>
💻 Я НОУТБУК
</button>

</div>

</div>


<!-- ============================= -->
<!-- ТЕЛЕФОН -->
<!-- ============================= -->

<div
    id="phonePanel"
    class="card hidden"
>

<h2>📱 Телефон</h2>

<p>
Введи этот код на ноутбуке:
</p>

<div
    id="roomCode"
    class="code"
>
------
</div>

<div
    id="phoneStatus"
    class="status"
>
Создание кода...
</div>

<video
    id="localVideo"
    autoplay
    playsinline
    muted
></video>

<button onclick="startCamera()">
📷 Включить камеру
</button>

<button
    class="red"
    onclick="location.reload()"
>
⛔ Остановить
</button>

</div>


<!-- ============================= -->
<!-- НОУТБУК -->
<!-- ============================= -->

<div
    id="pcPanel"
    class="card hidden"
>

<h2>💻 Ноутбук</h2>

<p>
Введи код телефона:
</p>

<input
    id="codeInput"
    maxlength="6"
    inputmode="numeric"
    placeholder="000000"
>

<button onclick="connectPC()">
🔗 Подключиться
</button>

<div
    id="pcStatus"
    class="status"
>
🔴 Не подключено
</div>

<video
    id="remoteVideo"
    autoplay
    playsinline
></video>

<button
    class="red"
    onclick="location.reload()"
>
⛔ Отключиться
</button>

</div>


</div>


<script>

/* ===================================
   ПЕРЕМЕННЫЕ
=================================== */

let peer;

let signalConnection;

let role;

let localStream;

let rtc;

let roomCode;


/* ===================================
   СОЗДАТЬ СЛУЧАЙНЫЙ КОД
=================================== */

function generateCode() {

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}


/* ===================================
   ТЕЛЕФОН
=================================== */

function startPhone() {

    role = "phone";

    document
        .getElementById("selectPanel")
        .classList.add("hidden");

    document
        .getElementById("phonePanel")
        .classList.remove("hidden");


    createPhonePeer();

}


/* ===================================
   PEER ТЕЛЕФОНА
=================================== */

function createPhonePeer() {

    roomCode = generateCode();


    document
        .getElementById("roomCode")
        .innerText =
        roomCode;


    /*
       Peer ID = наш 6-значный код
    */

    peer = new Peer(
        roomCode,
        {
            debug: 1
        }
    );


    peer.on(
        "open",
        function(id) {

            document
                .getElementById("phoneStatus")
                .innerHTML =
                "🟢 Код готов. Жду ноутбук...";

            document
                .getElementById("phoneStatus")
                .className =
                "status green";

        }
    );


    /*
       Получаем соединение
       от ноутбука
    */

    peer.on(
        "connection",
        function(connection) {

            signalConnection =
                connection;


            signalConnection.on(
                "data",
                async function(data) {

                    console.log(
                        "PHONE SIGNAL:",
                        data
                    );


                    if (
                        data.type ===
                        "answer"
                    ) {

                        await rtc
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data
                                )
                            );

                    }


                    if (
                        data.type ===
                        "candidate"
                    ) {

                        try {

                            await rtc
                                .addIceCandidate(
                                    data.candidate
                                );

                        } catch(error) {

                            console.log(
                                "ICE:",
                                error
                            );

                        }

                    }

                }
            );


            signalConnection.on(
                "open",
                function() {

                    document
                        .getElementById(
                            "phoneStatus"
                        )
                        .innerHTML =
                        "🟢 Ноутбук подключён";

                    document
                        .getElementById(
                            "phoneStatus"
                        )
                        .className =
                        "status green";

                }
            );

        }
    );


    peer.on(
        "error",
        function(error) {

            console.log(
                "PHONE PEER ERROR:",
                error
            );

            /*
               Если код занят —
               создаём новый.
            */

            if (
                error.type ===
                "unavailable-id"
            ) {

                peer.destroy();

                createPhonePeer();

            }

        }
    );

}


/* ===================================
   КАМЕРА
=================================== */

async function startCamera() {

    try {

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "environment",

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: false

                });


        document
            .getElementById("localVideo")
            .srcObject =
            localStream;


        document
            .getElementById("phoneStatus")
            .innerText =
            "🟢 Камера включена";


        /*
           Если ноутбук уже подключился,
           создаём WebRTC
        */

        if (signalConnection) {

            createPhoneRTC();

        }

    } catch(error) {

        alert(
            "Ошибка камеры:\n\n" +
            error.message
        );

    }

}


/* ===================================
   WEBRTC НА ТЕЛЕФОНЕ
=================================== */

function createPhoneRTC() {

    rtc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    /*
       Добавляем камеру
    */

    localStream
        .getTracks()
        .forEach(
            function(track) {

                rtc.addTrack(
                    track,
                    localStream
                );

            }
        );


    /*
       ICE
    */

    rtc.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                signalConnection
            ) {

                signalConnection.send({

                    type:
                        "candidate",

                    candidate:
                        event.candidate

                });

            }

        };


    /*
       Создаём OFFER
    */

    rtc.createOffer()
        .then(
            function(offer) {

                return rtc
                    .setLocalDescription(
                        offer
                    );

            }
        )
        .then(
            function() {

                signalConnection.send({

                    type:
                        "offer",

                    sdp:
                        rtc.localDescription.sdp

                });

            }
        );

}


/* ===================================
   НОУТБУК
=================================== */

function startPC() {

    role = "pc";


    document
        .getElementById("selectPanel")
        .classList.add("hidden");


    document
        .getElementById("pcPanel")
        .classList.remove("hidden");


    peer = new Peer({
        debug: 1
    });


    peer.on(
        "open",
        function() {

            document
                .getElementById("pcStatus")
                .innerText =
                "🟢 Готов. Введи код телефона.";

        }
    );


    peer.on(
        "error",
        function(error) {

            console.log(
                "PC PEER ERROR:",
                error
            );

            document
                .getElementById("pcStatus")
                .innerText =
                "❌ " +
                error.type;

        }
    );

}


/* ===================================
   ПОДКЛЮЧЕНИЕ НОУТБУКА
=================================== */

function connectPC() {

    const code =
        document
            .getElementById("codeInput")
            .value
            .trim();


    if (!/^\d{6}$/.test(code)) {

        alert(
            "Введи 6 цифр."
        );

        return;

    }


    document
        .getElementById("pcStatus")
        .innerText =
        "🟡 Подключение...";


    /*
       Обычный DataConnection.
       Через него передаём WebRTC
       offer / answer / ICE.
    */

    signalConnection =
        peer.connect(code);


    signalConnection.on(
        "open",
        function() {

            document
                .getElementById("pcStatus")
                .innerText =
                "🟢 Телефон найден";

        }
    );


    signalConnection.on(
        "data",
        async function(data) {

            console.log(
                "PC SIGNAL:",
                data
            );


            /*
               Получили OFFER
            */

            if (
                data.type ===
                "offer"
            ) {

                createPCRTC();


                await rtc
                    .setRemoteDescription(
                        new RTCSessionDescription({

                            type:
                                "offer",

                            sdp:
                                data.sdp

                        })
                    );


                const answer =
                    await rtc
                        .createAnswer();


                await rtc
                    .setLocalDescription(
                        answer
                    );


                signalConnection.send({

                    type:
                        "answer",

                    sdp:
                        answer.sdp

                });

            }


            /*
               Получили ICE
            */

            if (
                data.type ===
                "candidate"
            ) {

                try {

                    await rtc
                        .addIceCandidate(
                            data.candidate
                        );

                } catch(error) {

                    console.log(
                        "ICE ERROR:",
                        error
                    );

                }

            }

        }
    );


    signalConnection.on(
        "close",
        function() {

            document
                .getElementById("pcStatus")
                .innerText =
                "🔴 Телефон отключился";

        }
    );

}


/* ===================================
   WEBRTC НОУТБУКА
=================================== */

function createPCRTC() {

    rtc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    /*
       Получаем видео телефона
    */

    rtc.ontrack =
        function(event) {

            console.log(
                "📷 ВИДЕО ПОЛУЧЕНО!"
            );


            const video =
                document
                    .getElementById(
                        "remoteVideo"
                    );


            video.srcObject =
                event.streams[0];


            video.play()
                .catch(
                    function(error) {

                        console.log(
                            "PLAY ERROR:",
                            error
                        );

                    }
                );


            document
                .getElementById("pcStatus")
                .innerHTML =
                "🟢 КАМЕРА ТЕЛЕФОНА РАБОТАЕТ";

            document
                .getElementById("pcStatus")
                .className =
                "status green";

        };


    /*
       ICE отправляем телефону
    */

    rtc.onicecandidate =
        function(event) {

            if (
                event.candidate &&
                signalConnection
            ) {

                signalConnection.send({

                    type:
                        "candidate",

                    candidate:
                        event.candidate

                });

            }

        };


    /*
       Нужен transceiver для
       одностороннего получения видео
    */

    rtc.addTransceiver(
        "video",
        {
            direction:
                "recvonly"
        }
    );

}

</script>

</body>
</html>
